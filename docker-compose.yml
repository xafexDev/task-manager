version: "3.9"

services:
  # ---------- API ----------
  api:
    build: .
    container_name: task_manager_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # ВАЖНО: используем asyncpg (асинхронный драйвер), не psycopg2.
      # SQLAlchemy 2.0 create_async_engine требует именно асинхронный драйвер.
      - DATABASE_URL=postgresql+asyncpg://taskmanager:taskmanager@postgres:5432/taskmanager
      - REDIS_URL=redis://redis:6379/0
      - RATE_LIMIT_ENABLED=true
      - UPLOAD_DIR=/app/uploads
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---------- PostgreSQL ----------
  postgres:
    image: postgres:16-alpine
    container_name: task_manager_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: taskmanager
      POSTGRES_USER: taskmanager
      POSTGRES_PASSWORD: taskmanager
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskmanager -d taskmanager"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------- Redis (для rate-limiting) ----------
  redis:
    image: redis:7-alpine
    container_name: task_manager_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
